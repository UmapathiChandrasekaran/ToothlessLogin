<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">

<div class="cinematic-viewport" [class.charging-blast]="isLoading" [class.success-blinking]="isSuccessBlinking">

    <div class="intro-sequence">
        <div class="intro-bolt"></div>
        <div class="intro-energy"></div>
    </div>

    <div class="plasma-blast-wave" *ngIf="isSuccess"></div>

    <div class="night-bg">
        <div class="thunder-flash"></div>

        <div *ngFor="let star of stars" class="star" [style.top]="star.top" [style.left]="star.left"
            [style.width]="star.size" [style.height]="star.size" [style.animation-delay]="star.delay"
            [style.animation-duration]="star.duration">
        </div>

        <div *ngFor="let cloud of clouds" class="cloud" [style.width]="cloud.width" [style.height]="cloud.height"
            [style.left]="cloud.left" [style.bottom]="cloud.bottom" [style.animation-delay]="cloud.delay">
        </div>
    </div>

    <div class="scene">

        <svg class="t1-wings-container cinematic-dragon" [class.hiding]="isPasswordFocused" viewBox="0 0 559.25 517.72"
            xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(37, -12)">
                <g id="left_wing" class="t1-svg-wing t1-svg-wing-left">
                    <path
                        d="M499.68,446s-58.66,27.9-114.33-40.1c0,0-52.85,15.58-85.85,93.58,0,0,50.29-10.58,56.23,20.42,0,0,20-28.18,54.47-3.09,0,0,2.48-22.91,32.48-19.91l45.14-40.31Z"
                        transform="translate(-298.67 -112.71)" fill="#727171" stroke="#070707" stroke-miterlimit="10" />
                    <path
                        d="M299.5,499.5c17-31,75.18-72.58,75.18-72.58,68,66,104.62,31,104.62,31,9.38-1,8.52-1.32,8.52-1.32"
                        transform="translate(-298.67 -112.71)" fill="#727171" stroke="#070707" stroke-miterlimit="10" />
                    <path
                        d="M410.2,516.83c-3.48-.09-35.52-89.91-35.52-89.91s-14.89,91-18.95,93C355.73,519.92,376.9,495.16,410.2,516.83Z"
                        transform="translate(-298.67 -112.71)" fill="#727171" stroke="#070707" stroke-miterlimit="10" />
                    <path
                        d="M447.5,447.5s-33.3-5.15-62.15-41.58c0,0-53.09,18.58-85.85,93.58,0,0,19.36-36.15,75.18-72.58,0,0,26.79,32.79,64.81,39.18,0,0,13.05,1.72,25-.6a77.07,77.07,0,0,0,23-9c9-7,9.88-5.92,13-11C500.87,444.9,447.11,448.05,447.5,447.5Z"
                        transform="translate(-298.67 -112.71)" fill="#444" stroke="#000" stroke-miterlimit="10" />
                </g>
            </g>
            <g transform="translate(37, -12)">
                <g id="right_wing" class="t1-svg-wing t1-svg-wing-right">
                    <path
                        d="M579.5,445.6s58.66,27.9,114.33-40.1c0,0,46.67,5,79.67,83,0,0-44.11,0-50,31,0,0-20-28.19-54.47-3.09,0,0-2.48-22.91-32.48-19.91l-45.14-40.31Z"
                        transform="translate(-298.67 -112.71)" fill="#727171" stroke="#070707" stroke-miterlimit="10" />
                    <path d="M590.36,456.19s-.86.31,8.52,1.32c0,0,36.62,35,104.62-31,0,0,52,31,69,62"
                        transform="translate(-298.67 -112.71)" fill="#727171" stroke="#070707" stroke-miterlimit="10" />
                    <path
                        d="M722.45,519.5c3,3.36-19-93-19-93s-32,89.81-35.52,89.91C668,516.41,696.39,490.5,722.45,519.5Z"
                        transform="translate(-298.67 -112.71)" fill="#727171" stroke="#070707" stroke-miterlimit="10" />
                    <path
                        d="M632.5,447.5s-56.81-4.55-56-3c1.49,2.85,18.75,12.15,19,16,.16,2.42,27.38,7.94,41,6,5.94-.85,45.22-14.34,67-40,0,0,62,37.53,69,63.27,0,0-28.34-77.27-79.67-84.27C692.83,405.5,658.5,446.5,632.5,447.5Z"
                        transform="translate(-298.67 -112.71)" fill="#444" stroke="#000" stroke-miterlimit="10" />
                </g>
            </g>
        </svg>

        <div class="t1-tail-container cinematic-dragon">
            <div class="t1-tail-main" [class.hiding]="isPasswordFocused"></div>
            <div class="t1-tail-fin-left" [class.hiding]="isPasswordFocused"></div>
            <div class="t1-tail-fin-right" [class.hiding]="isPasswordFocused"></div>
        </div>

        <div class="login-card login-card-cinematic" [class.slide-up]="isPasswordFocused">
            <h1 class="card-title">System Auth</h1>
            <p class="card-sub">Enterprise Identity Portal</p>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="off">
                <div class="field-group">
                    <input type="text" class="field-input" formControlName="username" placeholder=" " id="username"
                        (input)="onUsernameInput($event)" (focus)="onUsernameFocus()" (blur)="onUsernameBlur()" />
                    <label class="field-label" for="username">Username</label>
                </div>

                <div class="field-group">
                    <input type="password" class="field-input" formControlName="password" placeholder=" " id="password"
                        (focus)="onPasswordFocus()" (blur)="onPasswordBlur()" />
                    <label class="field-label" for="password">Password</label>
                </div>

                <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>

                <button type="submit" class="login-btn" [disabled]="isLoading">
                    <span>{{ isLoading ? 'Authenticating…' : 'Log In' }}</span>
                </button>
            </form>
        </div>

        <div class="t1-toothless-wrapper cinematic-dragon" [class.hiding]="isPasswordFocused">
            <div class="dragon-speech-bubble" *ngIf="currentUsername">
                Hi, {{ currentUsername }}!
            </div>

            <div class='t1-box'>
                <div class='t1-head'>
                    <div class='t1-head-copy'></div>
                    <div class='t1-chin'></div>
                    <div class='t1-ear-left'></div>
                    <div class='t1-ear-right'></div>

                    <div class='t1-eye-left' [class.red-eyes]="isRedEyed">
                        <div class='t1-pupil' [style.transform]="'translate(' + eyeX + 'px,' + eyeY + 'px)'">
                            <div class='t1-shine'></div>
                        </div>
                    </div>

                    <div class='t1-eye-right' [class.red-eyes]="isRedEyed">
                        <div class='t1-pupil' [style.transform]="'translate(' + eyeX + 'px,' + eyeY + 'px)'">
                            <div class='t1-shine'></div>
                        </div>
                    </div>

                    <div class='t1-nostril t1-left'></div>
                    <div class='t1-nostril t1-right'></div>

                    <div class='t1-feathers-left'>
                        <div class='t1-feather-top'></div>
                        <div class='t1-feather-bottom'></div>
                    </div>
                    <div class='t1-feathers-right'>
                        <div class='t1-feather-top'></div>
                        <div class='t1-feather-bottom'></div>
                    </div>

                    <div class='t1-horn-left'></div>
                    <div class='t1-horn-right'></div>

                    <div class='t1-spikes'>
                        <div class='t1-spike t1-one'></div>
                        <div class='t1-spike t1-two'></div>
                        <div class='t1-spike t1-three'></div>
                        <div class='t1-spike t1-four'></div>
                        <div class='t1-spike t1-five'></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="t1-hands-container cinematic-dragon">
            <div class="t1-hand t1-hand-left">
                <div class="t1-claw"></div>
                <div class="t1-claw"></div>
                <div class="t1-claw"></div>
            </div>
            <div class="t1-hand t1-hand-right">
                <div class="t1-claw"></div>
                <div class="t1-claw"></div>
                <div class="t1-claw"></div>
            </div>
        </div>

    </div>
</div>
